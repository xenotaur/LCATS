name: Coverage

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lcats
    env:
      # Unit tests use temporary authored fixtures, never the maintained catalog.
      LCATS_CACHE_DIR: ${{ github.workspace }}/.lcats-unit-cache

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            lcats/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run coverage (report + HTML)
        run: |
          python -m coverage erase
          python -m coverage run --source=lcats -m unittest discover -s tests -p "*_test.py"
          python -m coverage report -m
          python -m coverage html

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: lcats/htmlcov/
