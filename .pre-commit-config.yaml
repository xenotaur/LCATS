# Optional local checks for contributors.
# CI and scripts/* remain the source of truth.
#
# Known limitation: the black hook may self-report a bogus dev version
# (e.g. "0.1.dev1+g<hash>") regardless of the `rev:` pin below. This is a
# pre-commit + setuptools_scm interaction, not a config issue here: black
# computes its own version from git tags via setuptools_scm, and
# pre-commit's git clone for building the hook's environment does not
# fetch tags. If the black hook fails on a version mismatch while
# `scripts/format`/`scripts/lint` (the real source of truth) pass clean,
# treat it as this known limitation rather than a real formatting problem.
default_language_version:
  python: python3.11

# lcats/notebooks/ is deliberately NOT in this global exclude, unlike the
# other non-source directories below: the nbstripout hook needs to reach it
# to strip saved cell outputs before commit (outputs are the classic vector
# for a secret leaking into a notebook - see
# lcats/docs/how-to/secrets-hygiene.md). Every other hook in this file stays
# scoped to lcats/(src|tests|tools)/ via its own `files:` pattern, so
# removing notebooks/ from this list does not put notebooks in scope for
# ruff/black/etc.
exclude: |
  (?x)^(
    corpora/|
    experiments/|
    Papers/|
    Resources/|
    lcats/KMo/|
    lcats/output/|
    lcats/dist/|
    lcats/htmlcov/|
    lcats/src/lcats\.egg-info/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        files: ^lcats/(src|tests|tools)/.*$

      - id: end-of-file-fixer
        files: ^lcats/(src|tests|tools)/.*$

      - id: check-merge-conflict
        files: ^lcats/(src|tests|tools)/.*$

      - id: check-yaml
        files: ^lcats/(src|tests|tools)/.*\.(ya?ml)$

      - id: check-json
        files: ^lcats/(src|tests|tools)/.*\.json$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^lcats/(src|tests|tools)/.*\.py$

  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        files: ^lcats/(src|tests|tools)/.*\.py$

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        files: ^lcats/notebooks/.*\.ipynb$