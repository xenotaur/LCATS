[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcats"
dynamic = ["version"]
description = "Literary Captain's Advisory Tool System."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Anthony Francis", email = "centaur@logicalrobotics.com"},
    {name = "Kenneth Moorman", email = "kmoorman@transy.edu"},
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
   "unidecode",
   "beautifulsoup4",
   "PyYAML",
   "tiktoken",
   "pandas",
   "tqdm",
   "matplotlib",
   "seaborn",
   "gutenbergpy @ git+https://github.com/xenotaur/gutenbergpy.git@60ca548232f470e7aa7c22e8fde636db644cd80e",
   "anthropic",
   "openai>=1.0.0",
   "python-dotenv",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development",
]

[project.urls]
Repository = "https://github.com/xenotaur/LCATS"
Issues = "https://github.com/xenotaur/LCATS/issues"

[project.scripts]
lcats = "lcats.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the versioned gather-time override tables and survey allowlist config so
# they are present in wheel/sdist installs, not only in source checkouts.
"lcats.gatherers" = ["overrides/*.json"]
"lcats.analysis.corpus" = ["allowlists/*.json"]

[project.optional-dependencies]
nlp = [
    "stanza",
    "spacy",
]
dev = [
    "ruff==0.15.0",
    "black==25.11.0",
    "coverage",
    "parameterized",
]
# Kept as an alias rather than removed: CI workflows (.github/workflows/
# coverage.yml, tests.yml, cache_maintenance.yml) install ".[test]" by name.
test = [
    "lcats[dev]",
]

[tool.ruff]
required-version = "==0.15.0"

[tool.black]
required-version = "25.11.0"

[tool.setuptools_scm]
# lcats/ is a subdirectory of the git repo (the repo root, one level up,
# is where .git actually lives) -- without this, setuptools_scm can't
# find the git checkout and silently falls back to fallback_version on
# every build, never actually deriving a version from tags.
root = ".."
fallback_version = "0.1.0"
